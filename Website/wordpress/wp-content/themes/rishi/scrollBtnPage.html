<!-- scroll btn css -->
<style>
    #scrollTopBtn {
        background-color: #004c97;
        width: 43.13px;
        height: 43.33px;
        border-radius: 5px;
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 100;
        border: none;
        color: white;
        font-size: 12px;
    }

    #scrollTopBtn:hover {
        background-color: #003366; /* Darker shade on hover */
    }

    .arrow-icon-scroll-btn {
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 2px;
    }

    #scrollTopBtn svg {
        width: 12px;
        height: 12px;
    }
</style>
<!-- scroll btn css -->
<!-- Scroll top -->
<button id="scrollTopBtn" class="btn btn-primary">
    <div class="arrow-icon-scroll-btn">
        <svg class="e-font-icon-svg e-fas-chevron-up" fill="white" viewBox="0 0 448 512" xmlns="http://www.w3.org/2000/svg"><path d="M240.971 130.524l194.343 194.343c9.373 9.373 9.373 24.569 0 33.941l-22.667 22.667c-9.357 9.357-24.522 9.375-33.901.04L224 227.495 69.255 381.516c-9.379 9.335-24.544 9.317-33.901-.04l-22.667-22.667c-9.373-9.373-9.373-24.569 0-33.941L207.03 130.525c9.372-9.373 24.568-9.373 33.941-.001z"></path></svg>    </div>
    <div class="text">Top</div>
</button>
<!-- Scroll top -->
<!-- scroll btn js -->
<script>
    window.onscroll = function () {
        var scrollTopBtn = document.getElementById("scrollTopBtn");
        if (
            document.body.scrollTop > 100 ||
            document.documentElement.scrollTop > 100
        ) {
            scrollTopBtn.style.display = "flex";
        } else {
            scrollTopBtn.style.display = "none";
        }
    };

    // Scroll to the top of the page when the button is clicked
    document.getElementById("scrollTopBtn").onclick = function () {
        window.scrollTo({ top: 0, behavior: "smooth" });
    };
</script>
<!-- scroll btn js -->
